apiVersion: releasegraph.dev/v1
projects:
  core:
    kind: release
    repo: {owner: acme, name: core}
  cli:
    kind: release
    repo: {owner: acme, name: cli}
    dependsOn:
      - id: core
        condition: healthy
  web:
    kind: release
    repo: {owner: acme, name: web}
    dependsOn:
      - id: core
        condition: healthy
  deploy:
    kind: deploy
    repo: {owner: acme, name: deploy}
    dependsOn:
      - id: cli
        condition: healthy
      - id: web
        condition: healthy
