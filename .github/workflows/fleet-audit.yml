name: Fleet Audit
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
permissions: {contents: write}
concurrency: {group: fleet-audit, cancel-in-progress: false}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan every public owner repository
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 -m release_infra.cli fleet-audit --owner redtidev1918 --public-only
      - name: Commit dashboard when state changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add STATUS.md status.json migration/snapshots
          git diff --cached --quiet || git commit -m 'chore(dashboard): refresh fleet status'
          git push
