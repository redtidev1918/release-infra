name: Release Infrastructure v1

on:
  workflow_call:
    inputs:
      version: {type: string, default: ""}
      dry_run: {type: boolean, default: false}
      force: {type: boolean, default: false}
      repair: {type: boolean, default: false}
      stage: {type: string, default: all}
    secrets:
      RELEASE_PLEASE_TOKEN: {required: false}

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redtidev1918/release-infra
          ref: v1
          path: .release-infra
      - name: Policy and release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_REPAIR: ${{ inputs.repair }}
        run: |
          set -euo pipefail
          args=(--github-output "$GITHUB_OUTPUT")
          [[ -n "$INPUT_VERSION" ]] && args+=(--version "$INPUT_VERSION")
          [[ "$INPUT_FORCE" == true ]] && args+=(--force)
          [[ "$INPUT_REPAIR" == true ]] && args+=(--repair)
          PYTHONPATH=.release-infra python3 -m release_infra.cli static-check
          PYTHONPATH=.release-infra python3 -m release_infra.cli workflow-plan "${args[@]}"
      - name: Test
        if: steps.plan.outputs.run_release == '1'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          COMMAND: ${{ steps.plan.outputs.test_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: steps.plan.outputs.run_release == '1'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.build_command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Binary version gate
        if: steps.plan.outputs.run_release == '1' && steps.plan.outputs.version_check != ''
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          COMMAND: ${{ steps.plan.outputs.version_check }}
        run: bash -euo pipefail -c "$COMMAND"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_0
        if: steps.plan.outputs.run_release == '1'
        continue-on-error: true
        with:
          name: release-assets-${{ steps.plan.outputs.version }}
          path: |
            dist/release/
            dist/pypi/
          if-no-files-found: error
          retention-days: 7
      - if: steps.upload_0.outcome == 'failure'
        run: sleep 5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_1
        if: steps.upload_0.outcome == 'failure'
        continue-on-error: true
        with:
          name: release-assets-${{ steps.plan.outputs.version }}
          path: |
            dist/release/
            dist/pypi/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - if: steps.upload_0.outcome == 'failure' && steps.upload_1.outcome == 'failure'
        run: sleep 20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_2
        if: steps.upload_0.outcome == 'failure' && steps.upload_1.outcome == 'failure'
        continue-on-error: true
        with:
          name: release-assets-${{ steps.plan.outputs.version }}
          path: |
            dist/release/
            dist/pypi/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - if: steps.upload_0.outcome == 'failure' && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure'
        run: sleep 60
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_3
        if: steps.upload_0.outcome == 'failure' && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure'
        with:
          name: release-assets-${{ steps.plan.outputs.version }}
          path: |
            dist/release/
            dist/pypi/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  finalize:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redtidev1918/release-infra
          ref: v1
          path: .release-infra
      - name: Reload release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_REPAIR: ${{ inputs.repair }}
        run: |
          set -euo pipefail
          args=(--github-output "$GITHUB_OUTPUT")
          [[ -n "$INPUT_VERSION" ]] && args+=(--version "$INPUT_VERSION")
          [[ "$INPUT_FORCE" == true ]] && args+=(--force)
          [[ "$INPUT_REPAIR" == true ]] && args+=(--repair)
          PYTHONPATH=.release-infra python3 -m release_infra.cli workflow-plan "${args[@]}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: download_0
        if: steps.plan.outputs.run_release == '1'
        continue-on-error: true
        with:
          name: release-assets-${{ steps.plan.outputs.version }}
          path: dist
      - if: steps.download_0.outcome == 'failure'
        run: sleep 5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: download_1
        if: steps.download_0.outcome == 'failure'
        continue-on-error: true
        with:
          name: release-assets-${{ steps.plan.outputs.version }}
          path: dist
      - if: steps.download_0.outcome == 'failure' && steps.download_1.outcome == 'failure'
        run: sleep 20
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: download_2
        if: steps.download_0.outcome == 'failure' && steps.download_1.outcome == 'failure'
        continue-on-error: true
        with:
          name: release-assets-${{ steps.plan.outputs.version }}
          path: dist
      - if: steps.download_0.outcome == 'failure' && steps.download_1.outcome == 'failure' && steps.download_2.outcome == 'failure'
        run: sleep 60
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: download_3
        if: steps.download_0.outcome == 'failure' && steps.download_1.outcome == 'failure' && steps.download_2.outcome == 'failure'
        with:
          name: release-assets-${{ steps.plan.outputs.version }}
          path: dist
      - name: Asset gate and draft transaction
        if: steps.plan.outputs.run_release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD_STARTED_AT: ${{ github.event.head_commit.timestamp }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--version '${{ steps.plan.outputs.version }}')
          [[ "$DRY_RUN" == true ]] && args+=(--dry-run)
          PYTHONPATH=.release-infra python3 -m release_infra.cli asset-gate
          PYTHONPATH=.release-infra python3 -m release_infra.cli stage "${args[@]}"
      - name: Required registry publication
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.required_publish != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.required_publish }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Publish to PyPI with OIDC
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.pypi_enabled == 'true' }}
        continue-on-error: ${{ steps.plan.outputs.pypi_required != 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ steps.plan.outputs.pypi_packages_dir }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.ghcr_enabled == 'true' }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.ghcr_enabled == 'true' }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.ghcr_enabled == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish GHCR image
        id: ghcr
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.ghcr_enabled == 'true' }}
        continue-on-error: ${{ steps.plan.outputs.ghcr_required != 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ steps.plan.outputs.ghcr_context }}
          file: ${{ steps.plan.outputs.ghcr_file }}
          platforms: ${{ steps.plan.outputs.ghcr_platforms }}
          push: true
          tags: ${{ steps.plan.outputs.ghcr_image }}:${{ steps.plan.outputs.version }},${{ steps.plan.outputs.ghcr_image }}:latest
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Required registry verification
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.required_verify != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.required_verify }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Optional publication channels
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.optional_publish != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.optional_publish }}
        run: bash -uo pipefail -c "$COMMAND"
      - name: Optional channel verification
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.optional_verify != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.optional_verify }}
        run: bash -uo pipefail -c "$COMMAND"
      - name: Publish, set Latest, audit, then prune Release objects
        if: steps.plan.outputs.run_release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONTAINER_DIGEST: ${{ steps.ghcr.outputs.digest }}
          RELEASE_RETRY_COUNT: ${{ steps.plan.outputs.retry_count }}
        run: |
          set -euo pipefail
          args=(--version '${{ steps.plan.outputs.version }}')
          [[ "$DRY_RUN" == true ]] && args+=(--dry-run)
          PYTHONPATH=.release-infra python3 -m release_infra.cli publish "${args[@]}"
      - name: Optional post-release task
        if: ${{ steps.plan.outputs.run_release == '1' && !inputs.dry_run && steps.plan.outputs.post_publish != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          COMMAND: ${{ steps.plan.outputs.post_publish }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Release summary
        if: always()
        run: |
          echo '## Release Infrastructure v1' >> "$GITHUB_STEP_SUMMARY"
          echo '- version: `${{ steps.plan.outputs.version }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- stage: `${{ inputs.stage }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- result: `${{ job.status }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- retry count: `${{ steps.plan.outputs.retry_count }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- cooldown: `${{ steps.plan.outputs.cooldown }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- needs repair: `${{ steps.plan.outputs.needs_repair }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- recovery: `Run workflow → repair/retry current version`' >> "$GITHUB_STEP_SUMMARY"
