name: ReleaseGraph Read-Only Plan
on:
  workflow_call:
    inputs:
      graph:
        required: false
        type: string
        default: release-graph.yml
      state:
        required: false
        type: string
        default: health.json
      owner:
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redtidev1918/release-infra
          ref: v1
          path: .releasegraph-engine
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .releasegraph-engine/go.mod
      - name: Build read-only CLI
        run: (cd .releasegraph-engine && go build -trimpath -o ../releasegraph ./cmd/releasegraph)
      - name: Discover public fleet
        run: ./releasegraph fleet --owner "${{ inputs.owner }}" --public-only --output json > fleet.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Compute graph plan
        run: |
          if [ -f "${{ inputs.state }}" ]; then
            ./releasegraph plan --graph "${{ inputs.graph }}" --state "${{ inputs.state }}" --output json > release-plan.json
          else
            ./releasegraph graph --file "${{ inputs.graph }}" --output json > release-plan.json
          fi
      - name: Show plan
        run: cat release-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: releasegraph-readonly-plan
          path: |
            fleet.json
            release-plan.json
          retention-days: 14
