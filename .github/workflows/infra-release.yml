name: Promote stable v1
on:
  push:
    tags: ["v1.*.*"]
permissions: {contents: write}
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: python -m unittest discover -v
      - name: Move stable channel only after canary tests
        run: |
          git tag -f v1 "$GITHUB_SHA"
          git push origin refs/tags/v1 --force
      - name: Publish metadata-backed release
        run: |
          mkdir -p dist/release
          python -c 'import datetime as d, hashlib, json, os; from pathlib import Path; tag=os.environ["GITHUB_REF_NAME"]; version=tag.removeprefix("v"); policy=json.loads(Path(".release-policy.yml").read_text()); server=os.environ["GITHUB_SERVER_URL"]; repo=os.environ["GITHUB_REPOSITORY"]; run_id=os.environ["GITHUB_RUN_ID"]; policy_hash=hashlib.sha256(Path(".release-policy.yml").read_bytes()).hexdigest(); now=d.datetime.now(d.UTC).isoformat(); metadata={"repository":repo,"version":version,"tag":tag,"commit_sha":os.environ["GITHUB_SHA"],"build_run_id":run_id,"build_run_url":f"{server}/{repo}/actions/runs/{run_id}","releasegraph_version":version,"release_infra_version":version,"policy_hash":policy_hash,"release_policy_hash":policy_hash,"build_started_at":now,"published_at":now,"retry_count":0,"assets":[],"asset_sha256":{},"registries":policy.get("registries",{}),"container_digest":"","package_versions":{"github":version},"source_commit":os.environ["GITHUB_SHA"],"release_pr":None}; Path("dist/release/RELEASE-METADATA.json").write_text(json.dumps(metadata, indent=2)+"\n")'
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest dist/release/RELEASE-METADATA.json
        env:
          GH_TOKEN: ${{ github.token }}
